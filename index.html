<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<link rel="icon" href="data:,">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="2026 Eugene Marathon & Half Marathon Photos">
<meta property="og:description" content="A smoother infinite-scrolling interface to all 29,419 race day photos from the 2026 Eugene Marathon & Half Marathon.">
<meta property="og:type" content="website">
<meta name="description" content="A smoother infinite-scrolling interface to all 29,419 race day photos from the 2026 Eugene Marathon & Half Marathon.">
<title>2026 Eugene Marathon & Half Marathon Photos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #111;
  color: #eee;
  font-family: system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

#header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #1a1a1a;
  border-bottom: 1px solid #333;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

#header h1 {
  font-size: 1.1em;
  font-weight: 600;
  white-space: nowrap;
}

#controls {
  display: flex;
  align-items: center;
  gap: 12px;
  flex: 1 1 100%;
  min-width: 0;
}

#scrubber {
  flex: 1 1 0;
  min-width: 80px;
  display: flex;
  align-items: center;
  gap: 8px;
  overflow: hidden;
}

#scrubber input[type="range"] {
  flex: 1;
  height: 20px;
  cursor: pointer;
  accent-color: #888;
}

#scrubber .pos {
  color: #888;
  font-size: 0.8em;
  white-space: nowrap;
  min-width: 5em;
}

#search {
  flex: 0 0 auto;
  display: flex;
  align-items: center;
  gap: 6px;
}

#search input {
  width: 7em;
  padding: 4px 8px;
  border: 1px solid #555;
  border-radius: 4px;
  background: #222;
  color: #eee;
  font-size: 0.9em;
}

#search input::placeholder { color: #666; }

#search button {
  padding: 4px 10px;
  border: 1px solid #555;
  border-radius: 4px;
  background: #333;
  color: #eee;
  cursor: pointer;
  font-size: 0.85em;
}

#search button:hover { background: #444; }

#search .clear {
  display: none;
  background: none;
  border: none;
  color: #888;
  font-size: 1.2em;
  cursor: pointer;
  padding: 0 4px;
}

#search .clear:hover { color: #eee; }

#grid {
  display: grid;
  gap: 3px;
  padding: 3px;
  grid-template-columns: repeat(2, 1fr);
}

@media (min-width: 480px) {
  #grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 768px) {
  #grid { grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
}

@media (min-width: 1024px) {
  #grid { grid-template-columns: repeat(5, 1fr); }
}

@media (min-width: 1400px) {
  #grid { grid-template-columns: repeat(7, 1fr); }
}

@media (min-width: 1900px) {
  #grid { grid-template-columns: repeat(9, 1fr); }
}

.photo {
  aspect-ratio: 1;
  background-color: #222;
  cursor: pointer;
  display: block;
  overflow: hidden;
  position: relative;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.photo.context {
  opacity: 0.45;
}

.photo.context:hover {
  opacity: 0.7;
}

.photo.match::after {
  content: "";
  position: absolute;
  inset: 0;
  border: 3px solid #4ecdc4;
  pointer-events: none;
}

.cluster-divider {
  grid-column: 1 / -1;
  height: 2px;
  background: #333;
  margin: 8px 0;
}

@media (hover: hover) {
  .photo:not(.context):hover { opacity: 0.8; }
}

#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,0.95);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  touch-action: pan-y;
}

#lightbox.open {
  display: flex;
}

#lightbox img {
  max-width: 95vw;
  max-height: calc(100vh - 60px);
  max-height: calc(100dvh - 60px);
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

#lightbox .nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 2.5em;
  color: #fff;
  cursor: pointer;
  padding: 20px;
  user-select: none;
  opacity: 0.7;
  z-index: 210;
}

#lightbox .prev { left: 0; }
#lightbox .next { right: 0; }

@media (hover: hover) {
  #lightbox .nav { opacity: 0.5; }
  #lightbox .nav:hover { opacity: 1; }
}

@media (max-width: 600px) {
  #lightbox .nav {
    font-size: 2em;
    padding: 16px 10px;
  }
}

#lightbox .close {
  position: absolute;
  top: 8px;
  right: 12px;
  font-size: 2em;
  color: #fff;
  cursor: pointer;
  opacity: 0.7;
  z-index: 210;
  padding: 8px;
}

@media (hover: hover) {
  #lightbox .close { opacity: 0.5; }
  #lightbox .close:hover { opacity: 1; }
}

#lightbox .idx {
  position: absolute;
  bottom: 12px;
  color: #888;
  font-size: 0.85em;
}

#sentinel {
  height: 1px;
}

#loading {
  text-align: center;
  padding: 40px;
  color: #666;
  font-size: 1.1em;
}

#filter-info {
  text-align: center;
  padding: 12px;
  color: #aaa;
  font-size: 0.9em;
  display: none;
}

#filter-info span {
  color: #4ecdc4;
}

#filter-info button {
  margin-left: 12px;
  padding: 4px 14px;
  border: 1px solid #555;
  border-radius: 4px;
  background: #333;
  color: #eee;
  cursor: pointer;
  font-size: 0.9em;
}

#filter-info button:hover { background: #444; }
</style>
</head>
<body>

<div id="header">
  <h1>Eugene Marathon Photos</h1>
  <div id="controls">
    <div id="scrubber">
      <input type="range" min="0" max="0" value="0" id="slider">
      <span class="pos" id="slider-pos"></span>
    </div>
    <div id="search">
      <input type="text" placeholder="Bib #" id="bib-input" inputmode="numeric">
      <button id="bib-go">Search</button>
      <button class="clear" id="bib-clear">&times;</button>
    </div>
  </div>
</div>

<div id="filter-info"><span id="filter-msg"></span><button id="filter-clear">Show all photos</button></div>
<div id="grid"></div>
<div id="sentinel"></div>
<div id="loading">Loading photo index...</div>

<div id="lightbox">
  <span class="close">&times;</span>
  <span class="nav prev">&#8249;</span>
  <img src="" alt="">
  <span class="nav next">&#8250;</span>
  <span class="idx"></span>
</div>

<script>
(function() {
  var BATCH = 100;
  var CONTEXT = 2;
  var hashes = [];
  var bibs = {};
  var s3Prefix = "";
  var rendered = 0;
  var lightboxIdx = -1;

  // In filtered mode, viewIndices is the list of global indices shown in the grid.
  // Each element maps grid position -> hashes[] index.
  // null when showing all photos.
  var viewIndices = null;
  var matchSet = null; // Set of global indices that are actual matches (not context)
  var clusterMap = null; // gi -> cluster ID (precomputed when filtering)

  var grid = document.getElementById("grid");
  var loading = document.getElementById("loading");
  var sentinel = document.getElementById("sentinel");
  var lightbox = document.getElementById("lightbox");
  var lightboxImg = lightbox.querySelector("img");
  var lightboxIdxLabel = lightbox.querySelector(".idx");
  var slider = document.getElementById("slider");
  var sliderPos = document.getElementById("slider-pos");
  var scrubbing = false;
  var bibInput = document.getElementById("bib-input");
  var bibGo = document.getElementById("bib-go");
  var bibClear = document.getElementById("bib-clear");
  var filterInfo = document.getElementById("filter-info");
  var filterMsg = document.getElementById("filter-msg");
  var filterClearBtn = document.getElementById("filter-clear");

  function thumbUrl(hash) { return s3Prefix + hash + "_thumb.jpg"; }
  function midUrl(hash) { return s3Prefix + hash + "_mid.jpg"; }

  function totalVisible() {
    return viewIndices ? viewIndices.length : hashes.length;
  }

  function globalIdx(gridPos) {
    return viewIndices ? viewIndices[gridPos] : gridPos;
  }

  // --- Rendering ---

  function clearGrid() {
    grid.innerHTML = "";
    rendered = 0;
  }

  function renderBatch() {
    renderUpTo(rendered + BATCH);
  }

  function renderUpTo(target) {
    var total = totalVisible();
    if (rendered >= total) return;
    var end = Math.min(target, total);
    if (end <= rendered) return;
    var fragment = document.createDocumentFragment();

    var prevCluster = -1;
    if (rendered > 0 && clusterMap) {
      prevCluster = clusterMap[viewIndices[rendered - 1]];
    }

    for (var i = rendered; i < end; i++) {
      var gi = globalIdx(i);

      if (clusterMap) {
        var cluster = clusterMap[gi];
        if (prevCluster >= 0 && cluster !== prevCluster) {
          var div = document.createElement("div");
          div.className = "cluster-divider";
          fragment.appendChild(div);
        }
        prevCluster = cluster;
      }

      var a = document.createElement("a");
      a.className = "photo";
      a.href = midUrl(hashes[gi]);
      a.dataset.gridPos = i;
      a.dataset.gi = gi;

      if (matchSet && !matchSet.has(gi)) {
        a.classList.add("context");
      } else if (matchSet) {
        a.classList.add("match");
      }

      var img = document.createElement("img");
      img.alt = "Photo " + (gi + 1);
      a.appendChild(img);
      fragment.appendChild(a);
    }
    grid.appendChild(fragment);

    var photos = grid.querySelectorAll(".photo");
    for (var i = 0; i < photos.length; i++) {
      if (!photos[i].querySelector("img").src || photos[i].querySelector("img").src === location.href) {
        imgObserver.observe(photos[i]);
      }
    }

    rendered = end;
    if (rendered >= total) {
      loading.textContent = "";
    }
  }

  function buildClusterMap(indices) {
    // Merge overlapping context windows into clusters
    var sorted = indices.slice().sort(function(a, b) { return a - b; });
    clusterMap = {};
    var clusterId = 0;
    var clusterEnd = -Infinity;

    for (var i = 0; i < sorted.length; i++) {
      var lo = sorted[i] - CONTEXT;
      var hi = sorted[i] + CONTEXT;
      if (lo > clusterEnd + 1) {
        clusterId++;
      }
      clusterEnd = Math.max(clusterEnd, hi);
      for (var gi = Math.max(0, lo); gi <= Math.min(hashes.length - 1, hi); gi++) {
        clusterMap[gi] = clusterId;
      }
    }
  }

  // --- Scrubber ---

  function updateSliderLabel(idx) {
    var gi = globalIdx(Math.min(idx, totalVisible() - 1));
    sliderPos.textContent = (gi + 1).toLocaleString() + " / " + hashes.length.toLocaleString();
  }

  function updateSliderRange() {
    slider.max = Math.max(0, totalVisible() - 1);
    slider.value = 0;
    updateSliderLabel(0);
  }

  var scrubTimer = null;

  slider.addEventListener("input", function() {
    scrubbing = true;
    var idx = parseInt(slider.value);
    updateSliderLabel(idx);
    clearTimeout(scrubTimer);
    scrubTimer = setTimeout(function() {
      renderUpTo(idx + BATCH);
      var photos = grid.querySelectorAll(".photo");
      // Find the photo element at grid position idx
      for (var i = 0; i < photos.length; i++) {
        if (parseInt(photos[i].dataset.gridPos) === idx) {
          photos[i].scrollIntoView({ behavior: "auto", block: "center" });
          break;
        }
      }
      scrubbing = false;
      slider.blur();
    }, 150);
  });

  slider.addEventListener("keydown", function(e) {
    if (e.key === "PageUp" || e.key === "PageDown" || e.key === "Home" || e.key === "End") {
      e.preventDefault();
      slider.blur();
    }
  });

  // --- Observers ---

  var imgObserver = new IntersectionObserver(function(entries) {
    for (var j = 0; j < entries.length; j++) {
      if (entries[j].isIntersecting) {
        var el = entries[j].target;
        var gi = parseInt(el.dataset.gi);
        el.querySelector("img").src = thumbUrl(hashes[gi]);
        imgObserver.unobserve(el);
      }
    }
  }, { rootMargin: "400px" });

  var scrollObserver = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting && rendered < totalVisible()) {
      renderBatch();
    }
  }, { rootMargin: "800px" });

  scrollObserver.observe(sentinel);

  var scrollTick = false;
  window.addEventListener("scroll", function() {
    if (scrubbing || !hashes.length || scrollTick) return;
    scrollTick = true;
    requestAnimationFrame(function() {
      scrollTick = false;
      var headerH = document.getElementById("header").offsetHeight;
      var photos = grid.querySelectorAll(".photo");
      if (!photos.length) return;
      var lo = 0, hi = photos.length - 1;
      while (lo < hi) {
        var mid = (lo + hi) >>> 1;
        if (photos[mid].getBoundingClientRect().bottom < headerH) lo = mid + 1;
        else hi = mid;
      }
      var gridPos = parseInt(photos[lo].dataset.gridPos);
      slider.value = gridPos;
      updateSliderLabel(gridPos);
    });
  }, { passive: true });

  // --- Lightbox ---

  // In filtered mode, lightbox navigates all hashes (not just filtered),
  // so you can arrow through neighbors even past the displayed context.
  grid.addEventListener("click", function(e) {
    var photo = e.target.closest(".photo");
    if (!photo) return;
    e.preventDefault();
    lightboxIdx = parseInt(photo.dataset.gi);
    showLightbox();
  });

  function showLightbox() {
    var wasOpen = lightboxIdx >= 0 && lightbox.classList.contains("open");
    lightboxImg.src = midUrl(hashes[lightboxIdx]);
    var label = (lightboxIdx + 1).toLocaleString() + " / " + hashes.length.toLocaleString();
    if (matchSet && matchSet.has(lightboxIdx)) {
      label += " (match)";
    }
    lightboxIdxLabel.textContent = label;
    if (!wasOpen) {
      history.pushState({ lightbox: true }, "");
    }
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxImg.src = "";
    lightboxIdx = -1;
    document.body.style.overflow = "";
  }

  window.addEventListener("popstate", function() {
    if (lightboxIdx >= 0) {
      closeLightbox();
    }
  });

  function prevPhoto() {
    if (lightboxIdx > 0) { lightboxIdx--; showLightbox(); }
  }

  function nextPhoto() {
    if (lightboxIdx < hashes.length - 1) { lightboxIdx++; showLightbox(); }
  }

  function dismissLightbox() {
    if (lightboxIdx >= 0) history.back();
  }

  lightbox.querySelector(".close").addEventListener("click", dismissLightbox);
  lightbox.addEventListener("click", function(e) {
    if (e.target === lightbox) dismissLightbox();
  });
  lightbox.querySelector(".prev").addEventListener("click", function(e) {
    e.stopPropagation();
    prevPhoto();
  });
  lightbox.querySelector(".next").addEventListener("click", function(e) {
    e.stopPropagation();
    nextPhoto();
  });

  document.addEventListener("keydown", function(e) {
    if (lightboxIdx < 0) return;
    if (e.key === "Escape") dismissLightbox();
    if (e.key === "ArrowLeft") prevPhoto();
    if (e.key === "ArrowRight") nextPhoto();
  });

  // Swipe support for lightbox
  var touchStartX = 0;
  var touchStartY = 0;
  lightbox.addEventListener("touchstart", function(e) {
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
  }, { passive: true });

  lightbox.addEventListener("touchend", function(e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 40 || Math.abs(dy) > Math.abs(dx)) return;
    if (dx < 0) nextPhoto();
    else prevPhoto();
  }, { passive: true });

  // --- Bib search ---

  function searchBib(bib, skipUrl) {
    bib = bib.trim();
    if (!bib) { clearSearch(); return; }
    bibInput.value = bib;
    if (!skipUrl) {
      var url = new URL(location);
      url.searchParams.set("bib", bib);
      history.replaceState(null, "", url);
    }

    var indices = bibs[bib];
    if (!indices || indices.length === 0) {
      filterMsg.innerHTML = "No photos found for bib <span>#" + bib + "</span>. Bib detection is based on computer vision and may miss some photos.";
      filterInfo.style.display = "block";
      clearGrid();
      viewIndices = [];
      matchSet = new Set();
      updateSliderRange();
      return;
    }

    matchSet = new Set(indices);
    buildClusterMap(indices);

    // Build view: for each match, include CONTEXT neighbors on each side
    var allIndices = new Set();
    for (var i = 0; i < indices.length; i++) {
      for (var d = -CONTEXT; d <= CONTEXT; d++) {
        var ni = indices[i] + d;
        if (ni >= 0 && ni < hashes.length) {
          allIndices.add(ni);
        }
      }
    }
    viewIndices = Array.from(allIndices).sort(function(a, b) { return a - b; });

    filterMsg.innerHTML = "<span>" + indices.length + "</span> photo" +
      (indices.length === 1 ? "" : "s") + " found for bib <span>#" + bib + "</span>" +
      " (showing nearby photos too). Bib detection is based on computer vision and may not be 100% accurate.";
    filterInfo.style.display = "block";
    bibClear.style.display = "inline";

    clearGrid();
    updateSliderRange();
    window.scrollTo(0, 0);
    renderUpTo(viewIndices.length); // show all matches at once
  }

  function clearSearch() {
    viewIndices = null;
    matchSet = null;
    clusterMap = null;
    filterInfo.style.display = "none";
    bibClear.style.display = "none";
    bibInput.value = "";
    var url = new URL(location);
    url.searchParams.delete("bib");
    history.replaceState(null, "", url);

    clearGrid();
    updateSliderRange();
    window.scrollTo(0, 0);
    renderBatch();
  }

  bibGo.addEventListener("click", function() { searchBib(bibInput.value); });
  filterClearBtn.addEventListener("click", clearSearch);
  bibInput.addEventListener("keydown", function(e) {
    if (e.key === "Enter") searchBib(bibInput.value);
  });
  bibClear.addEventListener("click", clearSearch);

  // --- Load data ---

  fetch("photos.json", { cache: "no-cache" })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      hashes = data.hashes;
      s3Prefix = data.s3_prefix;
      bibs = data.bibs || {};
      loading.textContent = "";
      document.querySelector("#header h1").textContent =
        "Eugene Marathon & Half Marathon Photos";

      var hasBibs = Object.keys(bibs).length > 0;
      if (!hasBibs) {
        document.getElementById("search").style.display = "none";
      }

      updateSliderRange();

      var urlBib = new URLSearchParams(location.search).get("bib");
      if (urlBib && bibs[urlBib]) {
        searchBib(urlBib, true);
      } else {
        renderBatch();
      }
    })
    .catch(function(err) {
      loading.textContent = "Failed to load photos.json: " + err.message;
    });
})();
</script>
</body>
</html>
