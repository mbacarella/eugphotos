<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta property="og:title" content="2026 Eugene Marathon & Half Marathon Photos">
<meta property="og:description" content="A smoother infinite-scrolling interface to all 29,419 race day photos from the 2026 Eugene Marathon & Half Marathon.">
<meta property="og:type" content="website">
<meta name="description" content="A smoother infinite-scrolling interface to all 29,419 race day photos from the 2026 Eugene Marathon & Half Marathon.">
<title>2026 Eugene Marathon & Half Marathon Photos</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #111;
  color: #eee;
  font-family: system-ui, -apple-system, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

#header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: #1a1a1a;
  border-bottom: 1px solid #333;
  padding: 10px 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
}

#header h1 {
  font-size: 1.1em;
  font-weight: 600;
  white-space: nowrap;
}

#scrubber {
  flex: 1;
  min-width: 120px;
  display: flex;
  align-items: center;
  gap: 8px;
}

#scrubber input[type="range"] {
  flex: 1;
  height: 20px;
  cursor: pointer;
  accent-color: #888;
}

#scrubber .pos {
  color: #888;
  font-size: 0.8em;
  white-space: nowrap;
  min-width: 5em;
}

#grid {
  display: grid;
  gap: 3px;
  padding: 3px;
  grid-template-columns: repeat(2, 1fr);
}

@media (min-width: 480px) {
  #grid { grid-template-columns: repeat(3, 1fr); }
}

@media (min-width: 768px) {
  #grid { grid-template-columns: repeat(4, 1fr); gap: 4px; padding: 4px; }
}

@media (min-width: 1024px) {
  #grid { grid-template-columns: repeat(5, 1fr); }
}

@media (min-width: 1400px) {
  #grid { grid-template-columns: repeat(7, 1fr); }
}

@media (min-width: 1900px) {
  #grid { grid-template-columns: repeat(9, 1fr); }
}

.photo {
  aspect-ratio: 1;
  background-color: #222;
  cursor: pointer;
  display: block;
  overflow: hidden;
}

.photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

@media (hover: hover) {
  .photo:hover { opacity: 0.8; }
}

#lightbox {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 200;
  background: rgba(0,0,0,0.95);
  flex-direction: column;
  align-items: center;
  justify-content: center;
  touch-action: pan-y;
}

#lightbox.open {
  display: flex;
}

#lightbox img {
  max-width: 95vw;
  max-height: calc(100vh - 60px);
  max-height: calc(100dvh - 60px);
  object-fit: contain;
  user-select: none;
  -webkit-user-drag: none;
}

#lightbox .nav {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  font-size: 2.5em;
  color: #fff;
  cursor: pointer;
  padding: 20px;
  user-select: none;
  opacity: 0.7;
  z-index: 210;
}

#lightbox .prev { left: 0; }
#lightbox .next { right: 0; }

@media (hover: hover) {
  #lightbox .nav { opacity: 0.5; }
  #lightbox .nav:hover { opacity: 1; }
}

@media (max-width: 600px) {
  #lightbox .nav {
    font-size: 2em;
    padding: 16px 10px;
  }
}

#lightbox .close {
  position: absolute;
  top: 8px;
  right: 12px;
  font-size: 2em;
  color: #fff;
  cursor: pointer;
  opacity: 0.7;
  z-index: 210;
  padding: 8px;
}

@media (hover: hover) {
  #lightbox .close { opacity: 0.5; }
  #lightbox .close:hover { opacity: 1; }
}

#lightbox .idx {
  position: absolute;
  bottom: 12px;
  color: #888;
  font-size: 0.85em;
}

#sentinel {
  height: 1px;
}

#loading {
  text-align: center;
  padding: 40px;
  color: #666;
  font-size: 1.1em;
}
</style>
</head>
<body>

<div id="header">
  <h1>Eugene Marathon Photos</h1>
  <div id="scrubber">
    <input type="range" min="0" max="0" value="0" id="slider">
    <span class="pos" id="slider-pos"></span>
  </div>
</div>

<div id="grid"></div>
<div id="sentinel"></div>
<div id="loading">Loading photo index...</div>

<div id="lightbox">
  <span class="close">&times;</span>
  <span class="nav prev">&#8249;</span>
  <img src="" alt="">
  <span class="nav next">&#8250;</span>
  <span class="idx"></span>
</div>

<script>
(function() {
  var BATCH = 100;
  var hashes = [];
  var s3Prefix = "";
  var rendered = 0;
  var lightboxIdx = -1;

  var grid = document.getElementById("grid");
  var loading = document.getElementById("loading");
  var sentinel = document.getElementById("sentinel");
  var lightbox = document.getElementById("lightbox");
  var lightboxImg = lightbox.querySelector("img");
  var lightboxIdxLabel = lightbox.querySelector(".idx");
  var slider = document.getElementById("slider");
  var sliderPos = document.getElementById("slider-pos");
  var scrubbing = false;

  function thumbUrl(hash) { return s3Prefix + hash + "_thumb.jpg"; }
  function midUrl(hash) { return s3Prefix + hash + "_mid.jpg"; }

  function renderBatch() {
    renderUpTo(rendered + BATCH);
  }

  function renderUpTo(target) {
    if (rendered >= hashes.length) return;
    var end = Math.min(target, hashes.length);
    if (end <= rendered) return;
    var fragment = document.createDocumentFragment();
    for (var i = rendered; i < end; i++) {
      var a = document.createElement("a");
      a.className = "photo";
      a.href = midUrl(hashes[i]);
      a.dataset.idx = i;
      var img = document.createElement("img");
      img.alt = "Photo " + (i + 1);
      a.appendChild(img);
      fragment.appendChild(a);
    }
    grid.appendChild(fragment);

    for (var i = rendered; i < end; i++) {
      imgObserver.observe(grid.children[i]);
    }

    rendered = end;
    if (rendered >= hashes.length) {
      loading.textContent = "";
    }
  }

  function updateSliderLabel(idx) {
    sliderPos.textContent = (idx + 1).toLocaleString() + " / " + hashes.length.toLocaleString();
  }

  var scrubTimer = null;

  slider.addEventListener("input", function() {
    scrubbing = true;
    var idx = parseInt(slider.value);
    updateSliderLabel(idx);
    clearTimeout(scrubTimer);
    scrubTimer = setTimeout(function() {
      renderUpTo(idx + BATCH);
      var el = grid.children[idx];
      if (el) el.scrollIntoView({ behavior: "auto", block: "center" });
      scrubbing = false;
    }, 150);
  });

  var imgObserver = new IntersectionObserver(function(entries) {
    for (var j = 0; j < entries.length; j++) {
      if (entries[j].isIntersecting) {
        var el = entries[j].target;
        var idx = parseInt(el.dataset.idx);
        el.querySelector("img").src = thumbUrl(hashes[idx]);
        imgObserver.unobserve(el);
      }
    }
  }, { rootMargin: "400px" });

  var scrollObserver = new IntersectionObserver(function(entries) {
    if (entries[0].isIntersecting && rendered < hashes.length) {
      renderBatch();
    }
  }, { rootMargin: "800px" });

  scrollObserver.observe(sentinel);

  var scrollTick = false;
  window.addEventListener("scroll", function() {
    if (scrubbing || !hashes.length || scrollTick) return;
    scrollTick = true;
    requestAnimationFrame(function() {
      scrollTick = false;
      var headerH = document.getElementById("header").offsetHeight;
      var children = grid.children;
      if (!children.length) return;
      var lo = 0, hi = children.length - 1;
      while (lo < hi) {
        var mid = (lo + hi) >>> 1;
        if (children[mid].getBoundingClientRect().bottom < headerH) lo = mid + 1;
        else hi = mid;
      }
      slider.value = lo;
      updateSliderLabel(lo);
    });
  }, { passive: true });

  // Lightbox
  grid.addEventListener("click", function(e) {
    var photo = e.target.closest(".photo");
    if (!photo) return;
    e.preventDefault();
    lightboxIdx = parseInt(photo.dataset.idx);
    showLightbox();
  });

  function showLightbox() {
    var wasOpen = lightboxIdx >= 0 && lightbox.classList.contains("open");
    lightboxImg.src = midUrl(hashes[lightboxIdx]);
    lightboxIdxLabel.textContent = (lightboxIdx + 1) + " / " + hashes.length.toLocaleString();
    if (!wasOpen) {
      history.pushState({ lightbox: true }, "");
    }
    lightbox.classList.add("open");
    document.body.style.overflow = "hidden";
  }

  function closeLightbox() {
    lightbox.classList.remove("open");
    lightboxImg.src = "";
    lightboxIdx = -1;
    document.body.style.overflow = "";
  }

  window.addEventListener("popstate", function() {
    if (lightboxIdx >= 0) {
      closeLightbox();
    }
  });

  function prevPhoto() {
    if (lightboxIdx > 0) { lightboxIdx--; showLightbox(); }
  }

  function nextPhoto() {
    if (lightboxIdx < hashes.length - 1) { lightboxIdx++; showLightbox(); }
  }

  function dismissLightbox() {
    if (lightboxIdx >= 0) history.back();
  }

  lightbox.querySelector(".close").addEventListener("click", dismissLightbox);
  lightbox.addEventListener("click", function(e) {
    if (e.target === lightbox) dismissLightbox();
  });
  lightbox.querySelector(".prev").addEventListener("click", function(e) {
    e.stopPropagation();
    prevPhoto();
  });
  lightbox.querySelector(".next").addEventListener("click", function(e) {
    e.stopPropagation();
    nextPhoto();
  });

  document.addEventListener("keydown", function(e) {
    if (lightboxIdx < 0) return;
    if (e.key === "Escape") dismissLightbox();
    if (e.key === "ArrowLeft") prevPhoto();
    if (e.key === "ArrowRight") nextPhoto();
  });

  // Swipe support for lightbox
  var touchStartX = 0;
  var touchStartY = 0;
  lightbox.addEventListener("touchstart", function(e) {
    touchStartX = e.changedTouches[0].clientX;
    touchStartY = e.changedTouches[0].clientY;
  }, { passive: true });

  lightbox.addEventListener("touchend", function(e) {
    var dx = e.changedTouches[0].clientX - touchStartX;
    var dy = e.changedTouches[0].clientY - touchStartY;
    if (Math.abs(dx) < 40 || Math.abs(dy) > Math.abs(dx)) return;
    if (dx < 0) nextPhoto();
    else prevPhoto();
  }, { passive: true });

  // Load data
  fetch("photos.json")
    .then(function(r) { return r.json(); })
    .then(function(data) {
      hashes = data.hashes;
      s3Prefix = data.s3_prefix;
      loading.textContent = "";
      document.querySelector("#header h1").textContent =
        "Eugene Marathon & Half Marathon Photos";
      slider.max = hashes.length - 1;
      updateSliderLabel(0);
      renderBatch();
    })
    .catch(function(err) {
      loading.textContent = "Failed to load photos.json: " + err.message;
    });
})();
</script>
</body>
</html>
